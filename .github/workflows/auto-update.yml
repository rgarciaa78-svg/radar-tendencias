name: Auto-update Radar de Tendencias

on:
  schedule:
    # Todos los días a las 9am hora Perú (UTC-5 = 14:00 UTC)
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      models: read

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Generar tendencias con IA
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-trends-gemini.js

      - name: Construir la app
        run: npm run build

      - name: Commit y push
        run: |
          git config user.name "Radar Auto-Update"
          git config user.email "action@github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Sin cambios nuevos hoy."
          else
            git commit -m "Auto-update: tendencias $(date '+%Y-%m-%d')"
            git push
            echo "✅ Publicado en GitHub Pages"
          fi
